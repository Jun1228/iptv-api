[Settings]
# 1. 公网域名与服务端口（对接 Lucky 反代）
service_port = 8080
public_url = https://ys.dypage.dpdns.org:25433

# 2. 优先 4K 与画质/速率排序
open_speed_test = True
open_filter_resolution = True
open_filter_speed = True
sort_by = resolution,speed
min_resolution = 1920x1080
max_resolution = 3840x2160
min_speed = 0.5
resolution_speed_map = 1280x720:0.2,1920x1080:0.5,3840x2160:1.0

# 3. 导出与并发优化
output_urls_limit = 5
speed_test_target = 5
open_filter_ad = True
open_epg = True
open_m3u_result = True

# 4. 本地 Docker 运行若直连 GitHub 较慢，可取消下面注释启用加速
# cdn_url = https://gh-proxy.com/
